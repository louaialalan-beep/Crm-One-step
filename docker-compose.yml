services:
  # 1. PostgreSQL 16 Database with Row-Level Security (RLS) & Persistent Volume
  db:
    image: postgres:16-alpine
    container_name: crm_one_step_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-crm_one_step}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm_user} -d ${POSTGRES_DB:-crm_one_step}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Redis 7 Message Broker for ARQ Background Task Queue
  redis:
    image: redis:7-alpine
    container_name: crm_one_step_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 3. FastAPI Backend (Auto-runs alembic upgrade head + Uvicorn)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_one_step_backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Crm-One-step}
      APP_ENV: ${APP_ENV:-development}
      API_V1_STR: ${API_V1_STR:-/api/v1}
      POSTGRES_USER: ${POSTGRES_USER:-crm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-crm_one_step}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://crm_user:changeme_local_dev_pass@db:5432/crm_one_step}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      ZATCA_DEFAULT_SELLER_NAME: ${ZATCA_DEFAULT_SELLER_NAME:-Crm-One-step Demo}
      ZATCA_DEFAULT_VAT_NUMBER: ${ZATCA_DEFAULT_VAT_NUMBER:-300000000000003}
      ZATCA_VAT_RATE: ${ZATCA_VAT_RATE:-0.15}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v21.0}
      META_CAPI_ACCESS_TOKEN: ${META_CAPI_ACCESS_TOKEN:-}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-moyasar}
      PAYMENT_MOYASAR_SECRET_KEY: ${PAYMENT_MOYASAR_SECRET_KEY:-}
      PAYMENT_TAP_SECRET_KEY: ${PAYMENT_TAP_SECRET_KEY:-}
      PAYMENT_STRIPE_SECRET_KEY: ${PAYMENT_STRIPE_SECRET_KEY:-}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      PAYMENT_SUCCESS_URL: ${PAYMENT_SUCCESS_URL:-http://localhost/settings/subscription?status=success}
      PAYMENT_CANCEL_URL: ${PAYMENT_CANCEL_URL:-http://localhost/settings/subscription?status=cancel}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. ARQ Background Worker (Meta CAPI, Workflows, Bulk CSV Import, SMTP Emails)
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_one_step_worker
    restart: unless-stopped
    entrypoint: ["arq", "app.worker.WorkerSettings"]
    environment:
      APP_NAME: ${APP_NAME:-Crm-One-step}
      APP_ENV: ${APP_ENV:-development}
      API_V1_STR: ${API_V1_STR:-/api/v1}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://crm_user:changeme_local_dev_pass@db:5432/crm_one_step}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v21.0}
      META_CAPI_ACCESS_TOKEN: ${META_CAPI_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 5. Frontend SPA (Nginx serving React build + Reverse Proxy for /api/ and /ws/)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: crm_one_step_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api/v1}
    ports:
      - "3000:80"
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
